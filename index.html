n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];

<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; background: #fff8f5; color: #2d2d2d;
  }
  .hero {
    max-width: 640px; margin: 0 auto; padding: 24px 16px 60px;
  }
  h1 { font-size: 24px; line-height: 1.3; }
  .price { font-size: 22px; color: #e0562f; font-weight: 700; margin: 8px 0 20px; }
  .form-box {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, select {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 16px;
  }
  button {
    width: 100%; margin-top: 20px; padding: 14px; border: none;
    border-radius: 12px; background: #e0562f; color: #fff;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .note { font-size: 13px; color: #777; margin-top: 10px; }
  #status { margin-top: 14px; font-weight: 600; }
  .price-sub { font-size: 14px; color: #555; font-weight: 400; margin: -14px 0 20px; }
  .price-box {
    background: #fff3ec; border: 1px dashed #e0562f; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; color: #b8401f; font-weight: 700; margin-top: 6px;
  }
  textarea {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 16px; font-family: inherit; resize: vertical; min-height: 60px;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>Áo chống nắng chống tia UV cho bé - Bon Bon Shop</h1>
  <div class="price">Chỉ từ 79.000đ/áo</div>
  <div class="price-sub">
    Mua lẻ 1 áo: 99.000đ (đã gồm 20k ship) &nbsp;|&nbsp;
    Combo 2 áo: 158.000đ (miễn ship) &nbsp;|&nbsp;
    Combo 3 áo: 225.000đ (miễn ship)
  </div>

  <div class="form-box">
    <form id="leadForm">
      <label for="name">Họ tên</label>
      <input id="name" name="name" type="text" required />

      <label for="phone">Số điện thoại</label>
      <input id="phone" name="phone" type="tel" required />

      <label for="address">Địa chỉ nhận hàng (Địa Chỉ Cũ)</label>
      <input id="address" name="address" type="text" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành" />

      <label for="size">Chọn size (theo cân nặng của bé)</label>
      <select id="size" name="size" required>
        <option value="Size 1 (4-7kg)">Size 1 — bé nặng 4-7kg</option>
        <option value="Size 2 (7-9kg)">Size 2 — bé nặng 7-9kg</option>
        <option value="Size 3 (10-12kg)">Size 3 — bé nặng 10-12kg</option>
        <option value="Size 4 (13-14kg)">Size 4 — bé nặng 13-14kg</option>
        <option value="Size 5 (15-18kg)">Size 5 — bé nặng 15-18kg</option>
      </select>

      <label for="color">Chọn màu/mẫu</label>
      <select id="color" name="color" required>
        <option value="A11 - Nâu cài cúc">A11 - Nâu cài cúc</option>
        <option value="A10 - Hồng cài cúc">A10 - Hồng cài cúc</option>
        <option value="A9 - Choàng ghi">A9 - Choàng ghi</option>
        <option value="A8 - Choàng vàng">A8 - Choàng vàng</option>
        <option value="A7 - Choàng trắng sữa">A7 - Choàng trắng sữa</option>
        <option value="A6 - Choàng nâu">A6 - Choàng nâu</option>
        <option value="A5 - Choàng hồng">A5 - Choàng hồng</option>
        <option value="A3 - Khủng long vàng">A3 - Khủng long vàng</option>
        <option value="A4 - Tai gấu trắng sữa">A4 - Tai gấu trắng sữa</option>
        <option value="A2 - Tai gấu nâu">A2 - Tai gấu nâu</option>
        <option value="A1 - Khủng long xanh lá">A1 - Khủng long xanh lá</option>
      </select>

      <label for="quantity">Số lượng</label>
      <select id="quantity" name="quantity">
        <option value="1">Mua lẻ 1 áo — 99.000đ (đã gồm ship)</option>
        <option value="2">Combo 2 áo — 158.000đ (miễn ship)</option>
        <option value="3">Combo 3 áo — 225.000đ (miễn ship)</option>
      </select>

      <label for="note">Ghi chú thêm (không bắt buộc)</label>
      <textarea id="note" name="note" placeholder="VD: mua combo 2 áo nhưng muốn 2 màu khác nhau, ghi rõ ở đây..."></textarea>

      <div class="price-box" id="priceBox">Tổng Tiền Thanh Toán: 99.000đ</div>

      <button type="submit" id="submitBtn">Đặt hàng ngay</button>
      <div class="note">Chúng tôi sẽ gọi điện xác nhận đơn hàng trong vòng 30 phút.</div>
      <div id="status"></div>
    </form>
  </div>
</div>

<script>
// Đọc cookie _fbp / _fbc (Facebook tự tạo khi Pixel chạy) để gửi kèm
// lên server, giúp tăng độ khớp (Event Match Quality) cho CAPI.
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

// Sinh event_id ngẫu nhiên duy nhất cho MỖI lượt submit.
// event_id này phải được gửi giống hệt nhau ở cả pixel (client)
// và Conversions API (server) để Facebook loại trùng sự kiện.
function generateEventId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}

// Bảng giá CHÍNH THỨC (cập nhật 2026-09-06) cho Áo chống nắng (nhóm AAA):
// mua lẻ 1 áo không được miễn ship, mua combo 2-3 áo mới miễn ship.
const PRICE_BY_QTY = { '1': 99000, '2': 158000, '3': 225000 };

function getSelectedPrice() {
  const qty = document.getElementById('quantity').value;
  return PRICE_BY_QTY[qty] || PRICE_BY_QTY['1'];
}

function updatePriceBox() {
  const price = getSelectedPrice();
  document.getElementById('priceBox').textContent =
    'Tổng Tiền Thanh Toán: ' + price.toLocaleString('vi-VN') + 'đ';
}
document.getElementById('quantity').addEventListener('change', updatePriceBox);
updatePriceBox();

document.getElementById('leadForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  statusEl.textContent = 'Đang gửi...';

  const eventId = generateEventId();
  const price = getSelectedPrice();
  const payload = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    product: 'Áo chống nắng chống tia UV cho bé',
    size: document.getElementById('size').value,
    color: document.getElementById('color').value,
    quantity: document.getElementById('quantity').value,
    note: document.getElementById('note').value,
    event_id: eventId,
    event_source_url: window.location.href,
    fbp: getCookie('_fbp'),
    fbc: getCookie('_fbc') || (new URLSearchParams(window.location.search).get('fbclid')
      ? 'fb.1.' + Date.now() + '.' + new URLSearchParams(window.location.search).get('fbclid')
      : null)
  };

  // 1) Bắn sự kiện Lead phía TRÌNH DUYỆT (Pixel), dùng chung eventID
  //    để Facebook ghép cặp với sự kiện server gửi ở bước 2.
  if (window.fbq) {
    fbq('track', 'Lead', {
      content_name: payload.product,
      content_ids: [payload.color],
      currency: 'VND',
      value: price,
      num_items: Number(payload.quantity)
    }, { eventID: eventId });
  }

  // 2) Gửi dữ liệu về webhook của chính bạn (Vercel serverless function).
  //    Webhook này sẽ gửi tiếp sự kiện lên Facebook Conversions API (server-side)
  //    và có thể lưu lead vào Google Sheet / CRM / Pancake...
  try {
    const res = await fetch('/api/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Server error');
    statusEl.textContent = 'Đặt hàng thành công! Chúng tôi sẽ liên hệ sớm.';
    document.getElementById('leadForm').reset();
  } catch (err) {
    statusEl.textContent = 'Có lỗi xảy ra, vui lòng thử lại hoặc nhắn tin cho shop.';
    btn.disabled = false;
  }
});
</script>

</body>
</html>
