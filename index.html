<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; background: #fff8f5; color: #2d2d2d;
  }
  .hero {
    max-width: 640px; margin: 0 auto; padding: 24px 16px 60px;
  }
  h1 { font-size: 24px; line-height: 1.3; }
  .price { font-size: 22px; color: #e0562f; font-weight: 700; margin: 8px 0 20px; }
  .form-box {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, select {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 16px;
  }
  button {
    width: 100%; margin-top: 20px; padding: 14px; border: none;
    border-radius: 12px; background: #e0562f; color: #fff;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .note { font-size: 13px; color: #777; margin-top: 10px; }
  #status { margin-top: 14px; font-weight: 600; }
  .price-sub { font-size: 14px; color: #555; font-weight: 400; margin: -14px 0 20px; }
  .price-box {
    background: #fff3ec; border: 1px dashed #e0562f; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; color: #b8401f; font-weight: 700; margin-top: 6px;
  }
  textarea {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 16px; font-family: inherit; resize: vertical; min-height: 60px;
  }
  /* Bảng chọn Size + Mẫu (tích chọn, thu gọn theo từng size) */
  .size-block {
    border: 1px solid #eee; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
  }
  .size-block-header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    cursor: pointer; flex-wrap: wrap;
  }
  .size-block-header:hover { opacity: 0.85; }
  .size-block-title { font-weight: 700; font-size: 15px; }
  .size-block-toggle { font-size: 13px; color: #e0562f; font-weight: 600; text-align: right; }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip-wrap.collapsed { display: none; }
  .chip {
    display: flex; align-items: center; gap: 6px; border: 1px solid #ddd; border-radius: 999px;
    padding: 6px 10px; font-size: 13px; font-weight: 500; cursor: pointer; background: #fafafa;
  }
  .chip input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: #e0562f; }
  .chip input[type="checkbox"]:disabled { cursor: not-allowed; }
  .chip.checked { border-color: #e0562f; background: #fff3ec; color: #b8401f; }
  .chip.disabled { opacity: 0.45; cursor: not-allowed; }
  #matrixHint { font-size: 13px; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>

<div class="hero">
  <h1>Áo chống nắng chống tia UV cho bé - Bon Bon Shop</h1>
  <div class="price">Chỉ từ 79.000đ/áo</div>
  <div class="price-sub">
    Mua lẻ 1 áo: 99.000đ (đã gồm 20k ship) &nbsp;|&nbsp;
    Combo 2 áo: 158.000đ (miễn ship) &nbsp;|&nbsp;
    Combo 3 áo: 225.000đ (miễn ship)
  </div>

  <div class="form-box">
    <form id="leadForm">
      <label for="name">Họ tên</label>
      <input id="name" name="name" type="text" required />

      <label for="phone">Số điện thoại</label>
      <input id="phone" name="phone" type="tel" required />

      <label for="address">Địa chỉ nhận hàng (Địa Chỉ Cũ)</label>
      <input id="address" name="address" type="text" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành" />

      <label for="quantity">Số lượng (Tổng số mua)</label>
      <select id="quantity" name="quantity">
        <option value="1">Mua lẻ 1 áo — 99.000đ (đã gồm ship)</option>
        <option value="2">Combo 2 áo — 158.000đ (miễn ship)</option>
        <option value="3">Combo 3 áo — 225.000đ (miễn ship)</option>
      </select>

      <label>Chọn size &amp; mẫu cho từng áo</label>
      <div id="sizeMauMatrix"></div>
      <div id="matrixHint"></div>

      <label for="note">Ghi chú thêm (không bắt buộc)</label>
      <textarea id="note" name="note" placeholder="VD: giao giờ hành chính, hẹn giờ giao..."></textarea>

      <div class="price-box" id="priceBox">Tổng Tiền Thanh Toán: 99.000đ</div>

      <button type="submit" id="submitBtn">Đặt hàng ngay</button>
      <div class="note">Chúng tôi sẽ gửi hàng luôn hôm nay, khoảng từ 2-4 hôm nhận được hàng.</div>
      <div id="status"></div>
    </form>
  </div>
</div>

<script>
// Đọc cookie _fbp / _fbc (Facebook tự tạo khi Pixel chạy) để gửi kèm
// lên server, giúp tăng độ khớp (Event Match Quality) cho CAPI.
function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

// Sinh event_id ngẫu nhiên duy nhất cho MỖI lượt submit.
// event_id này phải được gửi giống hệt nhau ở cả pixel (client)
// và Conversions API (server) để Facebook loại trùng sự kiện.
function generateEventId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}

// Bảng giá CHÍNH THỨC (cập nhật 2026-09-06) cho Áo chống nắng (nhóm AAA):
// mua lẻ 1 áo không được miễn ship, mua combo 2-3 áo mới miễn ship.
const PRICE_BY_QTY = { '1': 99000, '2': 158000, '3': 225000 };

function getSelectedPrice() {
  const qty = document.getElementById('quantity').value;
  return PRICE_BY_QTY[qty] || PRICE_BY_QTY['1'];
}

function updatePriceBox() {
  const price = getSelectedPrice();
  document.getElementById('priceBox').textContent =
    'Tổng Tiền Thanh Toán: ' + price.toLocaleString('vi-VN') + 'đ';
}

// ============================================================
// BẢNG CHỌN SIZE + MẪU (tích chọn theo từng size)
// Mỗi Size (1-5) là 1 khối, bên trong là các ô vuông tích Mẫu.
// - Tích ĐÚNG 1 ô  -> hiểu là TẤT CẢ áo trong đơn đều giống hệt ô đó
//   (VD Số lượng = 2, tích Size1+A1 -> 2 áo Size1 - A1).
// - Tích ĐÚNG BẰNG Số lượng đã chọn -> mỗi ô = 1 áo riêng, biết chính
//   xác size/mẫu từng áo (VD Số lượng = 2: tích Size1+A1 và Size2+A3
//   -> 1 áo Size1-A1 + 1 áo Size2-A3).
// - Tích sai số lượng (khác 1 và khác Số lượng) -> chặn gửi đơn.
//
// Cho phép mỗi video/mẫu quảng cáo CHỈ hiển thị đúng những mẫu được
// quảng cáo (giống tính năng cũ), thêm ?mau=... vào cuối link quảng cáo,
// cách nhau bằng dấu phẩy, áp dụng cho TẤT CẢ các khối size:
//   .../?mau=A3          -> mỗi khối size chỉ còn cột "A3 - Khủng long vàng"
//   .../?mau=A1,A3        -> mỗi khối size còn 2 cột A1 và A3
//   Không có ?mau=        -> mỗi khối size hiện đủ 11 mẫu như bình thường
// ============================================================
const SIZES = [
  { value: 'Size 1 (4-7kg)', label: 'Size 1 — bé nặng 4-7kg' },
  { value: 'Size 2 (7-9kg)', label: 'Size 2 — bé nặng 7-9kg' },
  { value: 'Size 3 (10-12kg)', label: 'Size 3 — bé nặng 10-12kg' },
  { value: 'Size 4 (13-14kg)', label: 'Size 4 — bé nặng 13-14kg' },
  { value: 'Size 5 (15-18kg)', label: 'Size 5 — bé nặng 15-18kg' }
];

const ALL_MAU = [
  { code: 'A11', value: 'A11 - Nâu cài cúc' },
  { code: 'A10', value: 'A10 - Hồng cài cúc' },
  { code: 'A9', value: 'A9 - Choàng ghi' },
  { code: 'A8', value: 'A8 - Choàng vàng' },
  { code: 'A7', value: 'A7 - Choàng trắng sữa' },
  { code: 'A6', value: 'A6 - Choàng nâu' },
  { code: 'A5', value: 'A5 - Choàng hồng' },
  { code: 'A3', value: 'A3 - Khủng long vàng' },
  { code: 'A4', value: 'A4 - Tai gấu trắng sữa' },
  { code: 'A2', value: 'A2 - Tai gấu nâu' },
  { code: 'A1', value: 'A1 - Khủng long xanh lá' }
];

function getFilteredMau() {
  const raw = new URLSearchParams(window.location.search).get('mau');
  if (!raw) return ALL_MAU;
  const codes = raw.split(',').map(c => c.trim().toUpperCase()).filter(Boolean);
  if (!codes.length) return ALL_MAU;
  const filtered = ALL_MAU.filter(m => codes.includes(m.code));
  return filtered.length ? filtered : ALL_MAU; // mã không khớp mẫu nào -> giữ đủ 11 mẫu
}

function getCheckedItems() {
  return Array.from(document.querySelectorAll('#sizeMauMatrix input[type="checkbox"]:checked'))
    .map(cb => ({ size: cb.dataset.size, color: cb.dataset.color }));
}

function refreshCheckboxAvailability() {
  const qty = Number(document.getElementById('quantity').value) || 1;
  const checked = getCheckedItems();
  const atLimit = qty > 1 && checked.length >= qty;
  document.querySelectorAll('#sizeMauMatrix input[type="checkbox"]').forEach(cb => {
    const shouldDisable = !cb.checked && atLimit;
    cb.disabled = shouldDisable;
    cb.closest('.chip').classList.toggle('disabled', shouldDisable);
  });
}

function updateMatrixHint() {
  const checked = getCheckedItems();
  const qty = Number(document.getElementById('quantity').value) || 1;
  const hint = document.getElementById('matrixHint');
  if (checked.length === 0) {
    hint.textContent = qty === 1
      ? 'Vui lòng tích chọn 1 size + mẫu cho áo.'
      : 'Tích 1 ô nếu ' + qty + ' áo giống hệt nhau, hoặc tích đúng ' + qty + ' ô nếu muốn mỗi áo 1 size/mẫu khác nhau.';
    hint.style.color = '#b8401f';
  } else if (checked.length === 1) {
    hint.textContent = qty === 1
      ? 'Đã chọn: ' + checked[0].size + ' - ' + checked[0].color
      : 'Đã chọn 1 mẫu — tính là ' + qty + ' áo giống nhau (' + checked[0].size + ' - ' + checked[0].color + ').';
    hint.style.color = '#2d7d46';
  } else if (checked.length === qty) {
    hint.textContent = 'Đã chọn đủ ' + qty + ' áo, mỗi áo 1 size/mẫu riêng.';
    hint.style.color = '#2d7d46';
  } else {
    hint.textContent = qty === 1
      ? 'Đã tích ' + checked.length + ' mẫu nhưng chỉ mua 1 áo — vui lòng bỏ bớt, chỉ tích đúng 1 mẫu.'
      : 'Đã tích ' + checked.length + ' ô nhưng Số lượng đang chọn là ' + qty +
        '. Vui lòng tích đúng 1 ô (để nhân theo số lượng) hoặc đúng ' + qty + ' ô.';
    hint.style.color = '#b8401f';
  }
}

// Cập nhật chữ trên dòng "Chọn mẫu ▾" của 1 khối Size: nếu khối đó đang có
// mẫu đã tích thì hiện luôn tên mẫu ngay cả khi đang thu gọn, để khách/khỏi
// cần mở ra lại mới biết mình đã chọn gì.
function refreshBlockToggle(block) {
  const toggle = block.querySelector('.size-block-toggle');
  const chipWrap = block.querySelector('.chip-wrap');
  const isCollapsed = chipWrap.classList.contains('collapsed');
  const arrow = isCollapsed ? '▾' : '▴';
  const checkedNames = Array.from(chipWrap.querySelectorAll('input[type="checkbox"]:checked'))
    .map(cb => cb.dataset.color);
  toggle.textContent = (checkedNames.length ? 'Đã chọn: ' + checkedNames.join(', ') : 'Chọn mẫu') + ' ' + arrow;
}

function refreshAllBlockToggles() {
  document.querySelectorAll('#sizeMauMatrix .size-block').forEach(refreshBlockToggle);
}

// Tích mẫu nào thì mẫu đó hiện "đã chọn" ngay, không tự động bỏ tích mẫu khác
// (kể cả khi Số lượng = 1) — để khách luôn thấy đúng những gì mình đã tích.
// Nếu số mẫu tích chưa khớp Số lượng đã chọn, dòng nhắc bên dưới (updateMatrixHint)
// sẽ báo rõ để khách tự điều chỉnh trước khi đặt hàng.
function onCheckboxChange(input, chip) {
  chip.classList.toggle('checked', input.checked);
  refreshCheckboxAvailability();
  updateMatrixHint();
  refreshAllBlockToggles();
}

function buildMatrix() {
  const mauList = getFilteredMau();
  const container = document.getElementById('sizeMauMatrix');
  container.innerHTML = '';
  SIZES.forEach((size, sIdx) => {
    const block = document.createElement('div');
    block.className = 'size-block';

    // Dòng tiêu đề bấm được để thu gọn/mở rộng phần tích mẫu bên dưới.
    const header = document.createElement('div');
    header.className = 'size-block-header';

    const title = document.createElement('span');
    title.className = 'size-block-title';
    title.textContent = size.label;

    const toggle = document.createElement('span');
    toggle.className = 'size-block-toggle';
    toggle.textContent = 'Chọn mẫu ▾';

    header.appendChild(title);
    header.appendChild(toggle);
    block.appendChild(header);

    const chipWrap = document.createElement('div');
    chipWrap.className = 'chip-wrap collapsed'; // mặc định thu gọn cho gọn trang

    mauList.forEach((mau, mIdx) => {
      const id = 'chk_' + sIdx + '_' + mIdx;
      const chip = document.createElement('label');
      chip.className = 'chip';
      chip.setAttribute('for', id);

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.id = id;
      input.dataset.size = size.value;
      input.dataset.color = mau.value;
      input.addEventListener('change', function () { onCheckboxChange(input, chip); });
      // Tránh bấm vào ô tích lại kích hoạt luôn sự kiện click trên header (đóng khối).
      input.addEventListener('click', function (evt) { evt.stopPropagation(); });

      const span = document.createElement('span');
      span.textContent = mau.value;

      chip.appendChild(input);
      chip.appendChild(span);
      chipWrap.appendChild(chip);
    });

    header.addEventListener('click', function () {
      chipWrap.classList.toggle('collapsed');
      refreshBlockToggle(block);
    });

    block.appendChild(chipWrap);
    container.appendChild(block);
    refreshBlockToggle(block);
  });
}

// Gom các ô đã tích thành danh sách áo cụ thể (size, color, quantity).
// Trả về null nếu số ô tích không hợp lệ (khác 1 và khác Số lượng đã chọn).
function resolveItems() {
  const checked = getCheckedItems();
  const qty = Number(document.getElementById('quantity').value) || 1;

  if (checked.length === 1) {
    return [{ size: checked[0].size, color: checked[0].color, quantity: qty }];
  }

  if (checked.length === qty) {
    const map = new Map();
    checked.forEach(it => {
      const key = it.size + '|' + it.color;
      map.set(key, (map.get(key) || 0) + 1);
    });
    return Array.from(map.entries()).map(([key, q]) => {
      const [size, color] = key.split('|');
      return { size, color, quantity: q };
    });
  }

  return null;
}

document.getElementById('quantity').addEventListener('change', function () {
  updatePriceBox();
  // Đổi Số lượng -> bỏ tích hết để tránh trạng thái không khớp, khách tích lại.
  document.querySelectorAll('#sizeMauMatrix input[type="checkbox"]:checked').forEach(cb => {
    cb.checked = false;
    cb.closest('.chip').classList.remove('checked');
  });
  refreshCheckboxAvailability();
  updateMatrixHint();
  refreshAllBlockToggles();
});

buildMatrix();
updatePriceBox();
refreshCheckboxAvailability();
updateMatrixHint();

document.getElementById('leadForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const statusEl = document.getElementById('status');

  const items = resolveItems();
  if (!items) {
    statusEl.textContent = 'Vui lòng tích đúng size/mẫu: tích 1 ô hoặc tích đúng số lượng đã chọn ở trên.';
    statusEl.style.color = '#b8401f';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  statusEl.style.color = '';
  statusEl.textContent = 'Đang gửi...';

  const eventId = generateEventId();
  const qty = Number(document.getElementById('quantity').value) || 1;
  const price = getSelectedPrice();
  const product = 'Áo chống nắng chống tia UV cho bé';
  const uniqueColors = [...new Set(items.map(i => i.color))];
  const contentName = items.map(i => [product, i.size, i.color].filter(Boolean).join(' - ')).join(' + ');

  const payload = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    product: product,
    items: items,
    quantity: qty,
    note: document.getElementById('note').value,
    event_id: eventId,
    event_source_url: window.location.href,
    fbp: getCookie('_fbp'),
    fbc: getCookie('_fbc') || (new URLSearchParams(window.location.search).get('fbclid')
      ? 'fb.1.' + Date.now() + '.' + new URLSearchParams(window.location.search).get('fbclid')
      : null)
  };

  // 1) Bắn sự kiện Lead phía TRÌNH DUYỆT (Pixel), dùng chung eventID
  //    để Facebook ghép cặp với sự kiện server gửi ở bước 2.
  if (window.fbq) {
    fbq('track', 'Lead', {
      content_name: contentName,
      content_ids: uniqueColors,
      currency: 'VND',
      value: price,
      num_items: qty
    }, { eventID: eventId });
  }

  // 2) Gửi dữ liệu về webhook của chính bạn (Vercel serverless function).
  //    Webhook này sẽ gửi tiếp sự kiện lên Facebook Conversions API (server-side)
  //    và tự động tạo đơn bên Pancake POS.
  try {
    const res = await fetch('/api/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Server error');
    statusEl.textContent = 'Đặt hàng thành công. Cảm ơn quý khách rất nhiều. Hotline: 0912628007';
    document.getElementById('leadForm').reset();
    buildMatrix();
    updatePriceBox();
    refreshCheckboxAvailability();
    updateMatrixHint();
    refreshAllBlockToggles();
  } catch (err) {
    statusEl.textContent = 'Có lỗi xảy ra, vui lòng thử lại hoặc nhắn tin cho shop.';
    btn.disabled = false;
  }
});
</script>

</body>
